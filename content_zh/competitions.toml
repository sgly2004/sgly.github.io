[[items]]
title = "RoboMaster 机甲大师"
subtitle = "车组负责人 / 研发代表"
content = "在队伍里负责机器人自主移动相关研发，做过上下位机串口通信、双 miniPC 间 TCP/IP 通信、传感器接入、建图导航方案验证，也用行为树组织自主决策。项目获得机甲大师联盟赛全国二等奖、对抗赛全国三等奖。"
tags = ["RoboMaster", "SLAM", "自主导航"]

