[[items]]
title = "Winihelper：AI 写作辅助工具"
subtitle = "2024.09 - 2025.06"
content = "Winihelper 是一个人类在环的 AI 写作辅助工具。我们从论文写作服务切入，逐步把选题、资料检索、内容生成和修改反馈沉淀为产品能力；当时已经在探索多智能体协作，并围绕真实写作流程做工具化落地。"
tags = ["AI 写作", "Multi-Agent", "人类在环"]

