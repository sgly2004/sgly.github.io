subtitle = "Agent infrastructure / Industrial agents"
content = "未卜岁关注 Agent infra 和产业级智能体，重点放在企业知识接入、工具调用、工作流编排和可持续运行的交付体系上。相比单点 Demo，我更关心智能体如何在真实业务里稳定工作、持续学习并被团队管理。"
