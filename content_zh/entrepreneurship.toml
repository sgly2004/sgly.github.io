[[items]]
title = "深澜智远：赋能千行百业的数据模型定制平台"
subtitle = "2025.09 - 2026.04"
content = "深澜智远面向传统行业的高损耗、错订和定价不准等问题，提供低成本行业本体模型和决策自动化系统。我们从生鲜行业切入，尝试把进货、上架、销售和复盘流程交给 AI 接管，并获得奇绩创坛投资。"
tags = ["深澜智远", "数据模型定制", "奇绩创坛"]

