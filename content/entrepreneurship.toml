[[items]]
title = "Winihelper: AI Writing Assistant"
subtitle = "2024.09 - 2025.06"
content = "Winihelper is a human-in-the-loop AI writing assistant. We started from academic writing services and gradually turned topic selection, retrieval, generation, and revision feedback into product capabilities. The project was already exploring multi-agent collaboration around real writing workflows."
tags = ["AI Writing", "Multi-Agent", "Human-in-the-loop"]

